<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOMIS算定サイドカー</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="app-header">
    <strong>ハルナス</strong>
    <span>HOMIS算定サイドカー</span>
    <span class="status-badge header-badge" id="connection-badge">未接続</span>
  </header>
  <main>
    <section class="panel-section" id="connection-section" aria-labelledby="connection-heading">
      <div class="section-heading">
        <h1 id="connection-heading">接続</h1>
      </div>
      <p class="muted" id="connection-copy">初回のみ、この端末を施設アカウントへ接続します。</p>
      <button class="button primary" id="connect-button" type="button">接続を開始</button>
      <div class="device-code" id="device-code-area" hidden>
        <span>確認コード</span>
        <strong id="device-code"></strong>
        <a class="button secondary" id="approval-link" rel="noopener noreferrer" target="_blank">承認ページを開く</a>
        <small>承認後、この画面は自動で接続されます。</small>
      </div>
    </section>

    <section class="panel-section" id="calculation-section" aria-labelledby="calculation-heading" hidden>
      <div class="section-heading">
        <h2 id="calculation-heading">表示中のカルテ</h2>
        <button class="button secondary compact" id="extract-button" type="button">再読み取り</button>
      </div>
      <div class="chart-preview" id="chart-preview" hidden>
        <dl>
          <div><dt>患者ID</dt><dd id="preview-patient"></dd></div>
          <div><dt>診療日</dt><dd id="preview-date"></dd></div>
          <div><dt>カルテID</dt><dd id="preview-record"></dd></div>
        </dl>
        <p class="preview-read-status" id="preview-read-status"></p>
      </div>
      <fieldset class="setting-control" id="setting-control" disabled>
        <legend>受診区分</legend>
        <div class="segmented-control">
          <label><input name="setting" type="radio" value="home_visit"><span>定期訪問</span></label>
          <label><input name="setting" type="radio" value="house_call"><span>往診</span></label>
          <label><input name="setting" type="radio" value="outpatient"><span>外来</span></label>
          <label><input name="setting" type="radio" value="telephone_revisit"><span>電話再診</span></label>
        </div>
        <p class="muted control-note" id="setting-copy"></p>
      </fieldset>
      <fieldset class="setting-control telephone-eligibility" id="telephone-eligibility-control" hidden>
        <legend>電話等再診の算定要件</legend>
        <p class="muted control-note">既診関係は同じ施設の受診履歴から判定します。</p>
        <label>
          <span>患者・家族からの相談</span>
          <select id="telephone-patient-initiated">
            <option value="unknown">未確認</option>
            <option value="true">あり</option>
            <option value="false">なし</option>
          </select>
        </label>
        <label>
          <span>治療上必要な指示</span>
          <select id="telephone-instruction-given">
            <option value="unknown">未確認</option>
            <option value="true">実施</option>
            <option value="false">未実施</option>
          </select>
        </label>
        <label>
          <span>定期的な医学管理</span>
          <select id="telephone-scheduled-management">
            <option value="unknown">未確認</option>
            <option value="false">該当しない</option>
            <option value="true">該当する</option>
          </select>
        </label>
      </fieldset>
      <fieldset class="setting-control" id="same-building-control" disabled>
        <legend>同一建物区分</legend>
        <div class="segmented-control same-building-options">
          <label><input name="same-building" type="radio" value="unknown"><span>未確認</span></label>
          <label><input name="same-building" type="radio" value="same"><span>同一建物</span></label>
          <label><input name="same-building" type="radio" value="outside"><span>同一建物以外</span></label>
        </div>
        <p class="muted control-note" id="same-building-copy"></p>
      </fieldset>
      <button class="button primary" id="calculate-button" type="button" disabled>算定案を作成</button>
    </section>

    <section class="panel-section result-section" id="result-section" aria-labelledby="result-heading" hidden>
      <div class="section-heading">
        <h2 id="result-heading">算定案</h2>
      </div>
      <div class="result-summary-bar">
        <div class="result-primary-metric">
          <span>算定案に含まれる点数</span>
          <strong class="total-points" id="total-points"></strong>
        </div>
        <span class="candidate-badge">承認前</span>
      </div>
      <div class="result-group" id="included-group">
        <h3>算定案に含まれる</h3>
        <div class="candidate-list" id="line-candidates"></div>
      </div>
      <div class="result-group" id="patient-charge-group" hidden>
        <h3>患者負担</h3>
        <div class="patient-charge-row">
          <label for="patient-charge-handling">在宅医療交通費</label>
          <div class="patient-charge-controls">
            <select id="patient-charge-handling" aria-label="在宅医療交通費の患者別設定">
              <option value="unknown">未設定</option>
              <option value="charge">請求する</option>
              <option value="waive">請求しない</option>
            </select>
            <button class="button secondary patient-charge-save" id="patient-charge-save" type="button">保存</button>
          </div>
          <span class="patient-charge-status" id="patient-charge-status"></span>
        </div>
      </div>
      <div class="result-group" id="decision-group">
        <h3 id="decision-heading">要判断</h3>
        <div class="decision-list" id="decision-candidates" role="list" aria-labelledby="decision-heading"></div>
      </div>
    </section>

    <p class="status-message" id="status-message" aria-live="polite"></p>
  </main>
  <script src="lib/environment.js"></script>
  <script src="lib/api.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
